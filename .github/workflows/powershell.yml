name: PowerShell CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          if (-not (Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue)) {
            Write-Error "PSScriptAnalyzer installation failed"
            exit 1
          }

      - name: Lint PowerShell module and function files
        shell: pwsh
        run: |
          $results = @()
          $results += Invoke-ScriptAnalyzer -Path win11-cve-audit.psm1 -Severity Error,Warning
          if (Test-Path functions) {
            $results += Invoke-ScriptAnalyzer -Path functions -Recurse -Severity Error,Warning
          }
          if ($results) {
            $results | Select-Object RuleName, Severity, File, Line, Message | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Write-Error "Linting failed with $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "✓ All module and function files pass linting"

      - name: Syntax validation
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem . -Recurse -Include *.ps1,*.psm1 | Where-Object { $_.Name -ne 'win11-cve-audit.ps1' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            try {
              $ast = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
              if (-not $ast) {
                $failed += $_.FullName
              }
            } catch {
              $failed += $_.FullName
              Write-Warning "Parse error in $($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($failed) {
            Write-Error "Syntax validation failed for: $($failed -join ', ')"
            exit 1
          }
          Write-Host "✓ All module/function scripts parse successfully"

      - name: Verify read-only operations
        shell: pwsh
        run: |
          $content = Get-ChildItem . -Recurse -Include *.ps1,*.psm1 | Where-Object { $_.Name -ne 'win11-cve-audit.ps1' } | ForEach-Object { Get-Content $_.FullName -Raw }
          $destructiveOps = @(
            "Remove-Item",
            "Remove-ItemProperty",
            "Set-Content",
            "Out-File",
            "Invoke-WebRequest\s+-Method\s+POST",
            "Invoke-RestMethod\s+-Method\s+POST",
            "Invoke-WebRequest\s+-Method\s+PUT",
            "Invoke-RestMethod\s+-Method\s+PUT",
            "Invoke-WebRequest\s+-Method\s+DELETE",
            "Invoke-RestMethod\s+-Method\s+DELETE"
          )
          $found = @()
          foreach ($op in $destructiveOps) {
            if ($content -match $op) {
              $found += $op
            }
          }
          if ($found) {
            Write-Warning "Potentially destructive operations detected (review required):"
            $found | ForEach-Object { Write-Warning "  $_" }
            # Not failing - these could be in comments or conditional blocks
          } else {
            Write-Host "✓ No obvious destructive operations"
          }

      - name: Check for hardcoded secrets
        shell: pwsh
        run: |
          $patterns = @(
            "api[_-]?key",
            "secret",
            "password",
            "token",
            "credential",
            "apikey",
            "access[_-]?key",
            "private[_-]?key"
          )
          $found = @()
          Get-ChildItem . -Recurse -Include *.ps1,*.psm1,*.psd1 | Where-Object { $_.Name -ne 'win11-cve-audit.ps1' } | ForEach-Object {
            $file = $_.FullName
            $text = Get-Content $file -Raw
            foreach ($pattern in $patterns) {
              if ($text -match "(?i)$pattern\s*[=:]\s*\S") {
                $found += "${file}: potential ${pattern}"
              }
            }
          }
          if ($found) {
            Write-Error "Potential hardcoded secrets found:"
            $found | ForEach-Object { Write-Error "  $_" }
            exit 1
          }
          Write-Host "✓ No hardcoded secrets detected"

      - name: Verify required documentation
        shell: bash
        run: |
          for file in README.md LICENSE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file is missing"
              exit 1
            fi
          done

      - name: Generate CI test fixtures (tests/ is gitignored)
        shell: pwsh
        run: |
          if (-not (Test-Path tests)) {
            Write-Host "tests/ directory not present; generating CI fixtures..."
            & ./scripts/generate-ci-fixtures.ps1
            if (-not (Test-Path tests)) {
              Write-Error "Fixture generation failed; tests/ directory still missing"
              exit 1
            }
          }

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          Import-Module Pester -MinimumVersion 6.0 -Force -ErrorAction SilentlyContinue
          $testResults = Invoke-Pester -Path 'tests\Verify-P01.ps1' -Output Detailed -PassThru
          $testResults += Invoke-Pester -Path 'tests\Verify-Winget.ps1' -Output Detailed -PassThru
          $testResults += Invoke-Pester -Path 'tests\Report.Tests.ps1' -Output Detailed -PassThru
          if ($testResults.FailedCount -gt 0) {
            Write-Error "Pester tests failed: $($testResults.FailedCount) of $($testResults.TotalCount)"
            exit 1
          }
          Write-Host "✓ All Pester tests passed ($($testResults.PassedCount)/$($testResults.TotalCount))"

  integration-test:
    name: Windows Integration Test
    runs-on: windows-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run full audit report (integration smoke test)
        shell: pwsh
        run: |
          # Import the module and generate a report to verify end-to-end flow works
          Import-Module ./win11-cve-audit.psd1 -Force -ErrorAction Stop
          $report = New-AuditReport -OutputPath (Join-Path $env:TEMP 'integration-audit-report.md') -ErrorAction Stop
          Write-Host "Report generated successfully"
          Write-Host "Report length: $($report.Length) characters"
          # Verify the report contains all required sections
          $requiredSections = @(
            'Executive Summary',
            'System Information',
            'Security Features',
            'Installed Applications',
            'CISA KEV Coverage',
            'Available Updates',
            'Pending Windows Updates',
            'Assessment Coverage and Limitations',
            'Data Sources and Timestamps',
            'Recommended Actions'
          )
          $missing = @()
          foreach ($section in $requiredSections) {
            if ($report -notmatch $section) {
              $missing += $section
            }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Report missing sections: $($missing -join ', ')"
            exit 1
          }
          Write-Host "✓ All 10 report sections present"

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: ${{ env.TEMP }}\integration-audit-report.md
          retention-days: 7

      