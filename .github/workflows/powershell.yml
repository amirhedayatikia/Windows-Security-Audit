name: PowerShell CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          if (-not (Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue)) {
            Write-Error "PSScriptAnalyzer installation failed"
            exit 1
          }

      - name: Lint PowerShell module and function files
        shell: pwsh
        run: |
          $results = @()
          $results += Invoke-ScriptAnalyzer -Path win11-cve-audit.psm1 -Severity Error,Warning
          if (Test-Path functions) {
            $results += Invoke-ScriptAnalyzer -Path functions -Recurse -Severity Error,Warning
          }
          if ($results) {
            $results | Select-Object RuleName, Severity, File, Line, Message | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            Write-Error "Linting failed with $($results.Count) issue(s)"
            exit 1
          }
          Write-Host "✓ All module and function files pass linting"

      - name: Syntax validation
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem . -Recurse -Include *.ps1,*.psm1 | Where-Object { $_.Name -ne 'win11-cve-audit.ps1' } | ForEach-Object {
            $tokens = $null
            $errors = $null
            try {
              $ast = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
              if (-not $ast) {
                $failed += $_.FullName
              }
            } catch {
              $failed += $_.FullName
              Write-Warning "Parse error in $($_.FullName): $($_.Exception.Message)"
            }
          }
          if ($failed) {
            Write-Error "Syntax validation failed for: $($failed -join ', ')"
            exit 1
          }
          Write-Host "✓ All module/function scripts parse successfully"

      - name: Verify read-only operations
        shell: pwsh
        run: |
          $content = Get-ChildItem . -Recurse -Include *.ps1,*.psm1 | Where-Object { $_.Name -ne 'win11-cve-audit.ps1' } | ForEach-Object { Get-Content $_.FullName -Raw }
          $destructiveOps = @(
            "Remove-Item",
            "Remove-ItemProperty",
            "Set-Content",
            "Out-File",
            "Invoke-WebRequest\s+-Method\s+POST",
            "Invoke-RestMethod\s+-Method\s+POST",
            "Invoke-WebRequest\s+-Method\s+PUT",
            "Invoke-RestMethod\s+-Method\s+PUT",
            "Invoke-WebRequest\s+-Method\s+DELETE",
            "Invoke-RestMethod\s+-Method\s+DELETE"
          )
          $found = @()
          foreach ($op in $destructiveOps) {
            if ($content -match $op) {
              $found += $op
            }
          }
          if ($found) {
            Write-Warning "Potentially destructive operations detected (review required):"
            $found | ForEach-Object { Write-Warning "  $_" }
            # Not failing - these could be in comments or conditional blocks
          } else {
            Write-Host "✓ No obvious destructive operations"
          }

      - name: Check for hardcoded secrets
        shell: pwsh
        run: |
          $patterns = @(
            "api[_-]?key",
            "secret",
            "password",
            "token",
            "credential",
            "apikey",
            "access[_-]?key",
            "private[_-]?key"
          )
          $found = @()
          Get-ChildItem . -Recurse -Include *.ps1,*.psm1,*.psd1 | Where-Object { $_.Name -ne 'win11-cve-audit.ps1' } | ForEach-Object {
            $file = $_.FullName
            $text = Get-Content $file -Raw
            foreach ($pattern in $patterns) {
              if ($text -match "(?i)$pattern\s*[=:]\s*\S") {
                $found += "${file}: potential ${pattern}"
              }
            }
          }
          if ($found) {
            Write-Error "Potential hardcoded secrets found:"
            $found | ForEach-Object { Write-Error "  $_" }
            exit 1
          }
          Write-Host "✓ No hardcoded secrets detected"

      - name: Verify required documentation
        shell: bash
        run: |
          for file in README.md LICENSE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file is missing"
              exit 1
            fi
          done

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          if (Test-Path tests) {
            Write-Host "Installing Pester..."
            Install-Module Pester -Force -Scope CurrentUser -ErrorAction SilentlyContinue
            $testResults = Invoke-Pester -Script @{ Path = 'tests\Verify-P01.ps1'; Parameters = @{} } -Output Detailed
            $testResults += Invoke-Pester -Script @{ Path = 'tests\Verify-Winget.ps1'; Parameters = @{} } -Output Detailed
            if ($testResults.FailedCount -gt 0) {
              Write-Error "Pester tests failed: $($testResults.FailedCount) of $($testResults.TotalCount)"
              exit 1
            }
            Write-Host "✓ All Pester tests passed ($($testResults.PassedCount)/$($testResults.TotalCount))"
          } else {
            Write-Warning "No tests directory found, skipping Pester tests"
          }

      